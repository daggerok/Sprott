name: TEMP live acceptance (delete before PR)

on:
  push:
    paths:
      - '.github/workflows/acceptance.yml'

permissions:
  contents: write

concurrency:
  group: acceptance
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Offline tests
        run: bun test
      # temporary trigger touch: the workflow is removed before the PR
      - name: Isolated live acceptance (URNM URNJ SETM, twice) + full generation (twice)
        run: |
          set -x
          REPORT="$GITHUB_WORKSPACE/scripts/fixtures/2026-10-01/live-acceptance.txt"
          {
            echo "live acceptance — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: ${GITHUB_RUN_ID} commit: ${GITHUB_SHA} runner: ${RUNNER_NAME} bun: $(bun --version)"
          } > "$REPORT"

          # --- isolated acceptance copy: does NOT touch the checked-out api/ ---
          rm -rf /tmp/accept && mkdir -p /tmp/accept
          tar --exclude=.git --exclude=node_modules -cf - . | (cd /tmp/accept && tar xf -)
          cd /tmp/accept
          set +e
          TICKERS="URNM URNJ SETM" VERBOSE=1 bun scripts/update-data.ts > /tmp/accept/run1.log 2>&1
          RC1=$?
          find api/sprott -type f | sort | xargs -r sha256sum > /tmp/accept/hashes1.txt
          TICKERS="URNM URNJ SETM" VERBOSE=1 bun scripts/update-data.ts > /tmp/accept/run2.log 2>&1
          RC2=$?
          find api/sprott -type f | sort | xargs -r sha256sum > /tmp/accept/hashes2.txt
          set -e
          STABLE=no; diff -q /tmp/accept/hashes1.txt /tmp/accept/hashes2.txt >/dev/null && STABLE=yes
          {
            echo ""
            echo "== isolated acceptance: TICKERS=\"URNM URNJ SETM\" VERBOSE=1 bun scripts/update-data.ts =="
            echo "exit codes: run1=$RC1 run2=$RC2   byte-stable: $STABLE"
            echo "config: $(awk '/^\[ config/{p=1} p&&/^\[ [a-z]/&&!/^\[ config/{p=0} p{print}' /tmp/accept/run1.log | tr '\n' ' ' | sed 's/  */ /g')"
            echo "files: $(wc -l < /tmp/accept/hashes1.txt) json files"
            echo "hashes (run 1 == run 2):"
            cat /tmp/accept/hashes1.txt
            echo "-- fund reporter lines --"
            grep -aE '^\[ +[0-9]+/' /tmp/accept/run1.log || true
            echo "-- provider warnings / fallbacks --"
            grep -aiE 'warn|fallback|retry|refus' /tmp/accept/run1.log | grep -v EDGAR_FALLBACK | head -20 || true
          } >> "$REPORT"

          # --- raw Yahoo stability probe (SGDJ pays distributions frequently) ---
          for n in 1 2; do
            curl -sS --max-time 60 -A "Mozilla/5.0" -H 'Accept: application/json' \
              "https://query1.finance.yahoo.com/v8/finance/chart/SGDJ?range=max&interval=1d&events=div%2Csplit" \
              -o "/tmp/sgdj-chart-$n.json" || echo "sgdj chart $n fetch failed"
          done
          sha256sum /tmp/sgdj-chart-1.json /tmp/sgdj-chart-2.json > /tmp/sgdj-chart-hashes.txt || true

          # --- full generation in the working tree (published api/sprott seed) ---
          cd "$GITHUB_WORKSPACE"
          bun scripts/update-data.ts > /tmp/full1.log 2>&1 || echo "full1 rc=$?" >> "$REPORT"
          find api/sprott -type f | sort | xargs -r sha256sum > /tmp/full-hashes1.txt
          rm -rf /tmp/after-run1 && cp -R api/sprott /tmp/after-run1
          bun scripts/update-data.ts > /tmp/full2.log 2>&1 || echo "full2 rc=$?" >> "$REPORT"
          find api/sprott -type f | sort | xargs -r sha256sum > /tmp/full-hashes2.txt
          bun scripts/update-data.ts > /tmp/full3.log 2>&1 || echo "full3 rc=$?" >> "$REPORT"
          find api/sprott -type f | sort | xargs -r sha256sum > /tmp/full-hashes3.txt
          FULL_STABLE=no; diff -q /tmp/full-hashes1.txt /tmp/full-hashes2.txt >/dev/null && FULL_STABLE=yes
          FULL_STABLE_23=no; diff -q /tmp/full-hashes2.txt /tmp/full-hashes3.txt >/dev/null && FULL_STABLE_23=yes
          {
            echo ""
            echo "== full generation: bun scripts/update-data.ts (all 13 funds) =="
            echo "byte-stable on rerun: $FULL_STABLE"
            echo "config: $(awk '/^\[ config/{p=1} p&&/^\[ [a-z]/&&!/^\[ config/{p=0} p{print}' /tmp/full1.log | tr '\n' ' ' | sed 's/  */ /g')"
            grep -aE '^\[ catalog|^\[ done|^\[ filter' /tmp/full1.log || true
            python3 -c "import json; d=json.load(open('api/sprott/index.json')); print('published counts:', d['counts']); [print(' ', f['ticker'], 'holdings=' + str(f['holdings']), 'history=' + str(f['history']), 'ter=' + str(f.get('terValue')), 'aum=' + str(f.get('aumValue')), 'divs=' + str((f.get('distributions') or {}).get('frequency'))) for f in d['funds']]"
            echo "-- fund reporter lines (full) --"
            grep -aE '^\[ +[0-9]+/' /tmp/full1.log || true
            echo "-- provider warnings / fallbacks (full) --"
            grep -aiE 'warn|fallback|retry|refus' /tmp/full1.log | grep -v EDGAR_FALLBACK | head -20 || true
            echo "byte-stable on third run: $FULL_STABLE_23"
            echo "-- raw Yahoo SGDJ chart hashes (two independent fetches) --"
            cat /tmp/sgdj-chart-hashes.txt || true
            if [ "$FULL_STABLE" = no ]; then
              echo "-- changed files run1 -> run2 --"
              diff /tmp/full-hashes1.txt /tmp/full-hashes2.txt | head -20 || true
              for changed in $(diff /tmp/full-hashes1.txt /tmp/full-hashes2.txt | awk '/^>/{print $3}'); do
                echo "-- diff ${changed} (run1 -> run2, first 30 lines) --"
                diff -u "/tmp/after-run1/${changed#api/sprott/}" "$changed" | head -30 || true
              done
            fi
            if [ "$FULL_STABLE_23" = no ]; then
              echo "-- changed files run2 -> run3 --"
              diff /tmp/full-hashes2.txt /tmp/full-hashes3.txt | head -20 || true
            fi
          } >> "$REPORT"
          tail -5 "$REPORT"
      - name: Commit generated feed + acceptance evidence
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/sprott scripts/fixtures/2026-10-01/live-acceptance.txt
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "chore(data): publish the Sprott feed and live acceptance evidence"
          git push
