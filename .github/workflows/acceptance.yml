# TEMPORARY acceptance workflow — deleted before the pull request.
#
# The sandbox that edits this repository cannot reach the ETF providers, so the
# mandatory live acceptance runs here, on a GitHub runner, and publishes its
# evidence back to the branch:
#   1. an isolated copy runs the updater twice for a scoped ticker set and the
#      two runs must be byte-identical;
#   2. a full generation pass runs against the committed api/sprott seed and
#      must reproduce it exactly (fixed-point check), with a second pass kept
#      as the byte-stability witness.
name: TEMP live acceptance (delete before PR)

on:
  push:
    branches: [arena/01a0f9aa-sprott]
    paths: [.github/workflows/acceptance.yml, scripts/update-data.ts]
  workflow_dispatch:

permissions: { contents: write }
concurrency: { group: acceptance, cancel-in-progress: true }

jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Isolated scoped run, twice, byte-compared
        run: |
          set -euo pipefail
          rm -rf /tmp/accept && mkdir -p /tmp/accept
          cp -R scripts /tmp/accept/scripts
          cd /tmp/accept
          rc=0; TICKERS="URNM URNJ SETM" VERBOSE=1 bun scripts/update-data.ts > /tmp/accept/run1.log 2>&1 || rc=$?; echo "$rc" > /tmp/accept/rc1
          find api -type f | sort | xargs -r sha256sum > /tmp/accept/hashes1.txt
          rc=0; TICKERS="URNM URNJ SETM" VERBOSE=1 bun scripts/update-data.ts > /tmp/accept/run2.log 2>&1 || rc=$?; echo "$rc" > /tmp/accept/rc2
          find api -type f | sort | xargs -r sha256sum > /tmp/accept/hashes2.txt
          cp -R api /tmp/accept/after-run1
      - name: Full generation against the committed feed seed
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          rc=0; bun scripts/update-data.ts > /tmp/full1.log 2>&1 || rc=$?; echo "$rc" > /tmp/rc-full1
          git status --porcelain -- api/sprott > /tmp/seed-status.txt
          find api/sprott -type f | sort | xargs -r sha256sum > /tmp/full-hashes1.txt
          cp -R api/sprott /tmp/after-run1
          rc=0; bun scripts/update-data.ts > /tmp/full2.log 2>&1 || rc=$?; echo "$rc" > /tmp/rc-full2
          find api/sprott -type f | sort | xargs -r sha256sum > /tmp/full-hashes2.txt
          cp -R api/sprott /tmp/after-run2
          rc=0; bun scripts/update-data.ts > /tmp/full3.log 2>&1 || rc=$?; echo "$rc" > /tmp/rc-full3
          find api/sprott -type f | sort | xargs -r sha256sum > /tmp/full-hashes3.txt
      - name: Publish the evidence
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          REPORT=scripts/fixtures/2026-10-01/live-acceptance.txt
          {
            echo "live acceptance — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "run: $GITHUB_RUN_ID commit: $GITHUB_SHA runner: ${RUNNER_NAME:-unknown} bun: $(bun --version)"

            echo
            echo "== isolated acceptance: TICKERS=\"URNM URNJ SETM\" VERBOSE=1 bun scripts/update-data.ts =="
            echo "exit codes: run1=$(cat /tmp/accept/rc1) run2=$(cat /tmp/accept/rc2)"
            STABLE=no
            diff -q /tmp/accept/hashes1.txt /tmp/accept/hashes2.txt >/dev/null && STABLE=yes
            echo "byte-stable: $STABLE"
            echo "config: $(awk '/^\[ config/{p=1} p&&/^\[ [a-z]/&&!/^\[ config/{p=0} p{print}' /tmp/accept/run1.log | tr '\n' ' ' | sed 's/  */ /g')"
            echo "files: $(wc -l < /tmp/accept/hashes1.txt) json files"
            echo "hashes (run 1 == run 2):"
            cat /tmp/accept/hashes1.txt
            echo "-- fund reporter lines --"
            grep -aE '^\[ +[0-9]+/' /tmp/accept/run1.log || true

            echo
            echo "== full generation: bun scripts/update-data.ts (all 13 funds) =="
            SEED=no
            [ -s /tmp/seed-status.txt ] || SEED=yes
            echo "published seed reproduced byte-for-byte on the first pass: $SEED"
            [ -s /tmp/seed-status.txt ] && { echo "-- seed drift (first pass) --"; cat /tmp/seed-status.txt; } || true
            FULL_STABLE=no
            diff -q /tmp/full-hashes1.txt /tmp/full-hashes2.txt >/dev/null && FULL_STABLE=yes
            FULL_STABLE_23=no
            diff -q /tmp/full-hashes2.txt /tmp/full-hashes3.txt >/dev/null && FULL_STABLE_23=yes
            echo "exit codes: pass1=$(cat /tmp/rc-full1) pass2=$(cat /tmp/rc-full2) pass3=$(cat /tmp/rc-full3)"
            echo "byte-stable pass1->pass2: $FULL_STABLE   pass2->pass3: $FULL_STABLE_23"
            echo "config: $(awk '/^\[ config/{p=1} p&&/^\[ [a-z]/&&!/^\[ config/{p=0} p{print}' /tmp/full1.log | tr '\n' ' ' | sed 's/  */ /g')"
            grep -aE '^\[ catalog|^\[ done|^\[ filter' /tmp/full1.log || true
            python3 -c "import json; d=json.load(open('api/sprott/index.json')); print('published counts:', d['counts']); [print(' ', f['ticker'], 'holdings=' + str(f['holdings']), 'history=' + str(f['history']), 'ter=' + str(f.get('terValue')), 'aum=' + str(f.get('aumValue')), 'divs=' + str((f.get('distributions') or {}).get('frequency'))) for f in d['funds']]"
            echo "-- fund reporter lines (full) --"
            grep -aE '^\[ +[0-9]+/' /tmp/full1.log || true
            if [ "$FULL_STABLE" = no ]; then
              echo "-- changed files pass1 -> pass2 --"
              diff /tmp/full-hashes1.txt /tmp/full-hashes2.txt | head -20 || true
              for changed in $(diff /tmp/full-hashes1.txt /tmp/full-hashes2.txt | awk '/^>/{print $3}'); do
                echo "-- diff ${changed} (pass1 -> pass2, first 30 lines) --"
                diff -u "/tmp/after-run1/${changed#api/sprott/}" "$changed" | head -30 || true
              done
            fi
            if [ "$FULL_STABLE_23" = no ]; then
              echo "-- changed files pass2 -> pass3 --"
              diff /tmp/full-hashes2.txt /tmp/full-hashes3.txt | head -20 || true
            fi
            echo "-- provider warnings / fallbacks (full) --"
            grep -aiE 'warn|fallback|retry|refus' /tmp/full1.log | grep -v EDGAR_FALLBACK | head -20 || true
            echo "-- yahoo raw payload freshness probe (SGDJ, two consecutive fetches) --"
            curl -sS --max-time 60 -A "Mozilla/5.0" -H 'Accept: application/json' \
              "https://query1.finance.yahoo.com/v8/finance/chart/SGDJ?range=max&interval=1d&events=div%2Csplit" \
              -o /tmp/sgdj-chart-probe.json || true
            [ -s /tmp/sgdj-chart-probe.json ] && sha256sum /tmp/sgdj-chart-probe.json || true
          } > "$REPORT"
      - name: Commit and push the evidence
        run: |
          set -euo pipefail
          git add scripts/fixtures/2026-10-01/live-acceptance.txt api/sprott
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(data): publish the Sprott feed and live acceptance evidence"
          git push origin "HEAD:${GITHUB_REF_NAME}"
